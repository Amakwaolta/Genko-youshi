<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原稿用紙エディタ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .genkou-cell {
            width: 34px;
            height: 34px;
            border: 1px solid var(--line-color, #ffb3b3);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            background: transparent;
            font-size: 1.1rem;
            caret-color: #2563eb;
        }
        .genkou-cell:focus {
            background-color: rgba(239, 246, 255, 0.6);
            border-color: #2563eb;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- コントロールパネル -->
    <div class="bg-white p-5 rounded-2xl shadow-md w-full max-w-5xl mb-6 flex flex-wrap gap-4 items-center justify-between">
        <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            📝 原稿用紙エディタ
        </h1>
        
        <div class="flex flex-wrap gap-3 items-center text-sm">
            <!-- 方向 -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">方向</label>
                <select id="writingMode" class="border rounded-lg px-2 py-1.5 bg-slate-50">
                    <option value="vertical-rl">縦書き</option>
                    <option value="horizontal-tb">横書き</option>
                </select>
            </div>

            <!-- フォント -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">フォント</label>
                <select id="fontFamily" class="border rounded-lg px-2 py-1.5 bg-slate-50">
                    <option value="'Yu Mincho', YuMincho, 'MS Mincho', serif">游明朝</option>
                    <option value="'Yu Gothic', YuGothic, 'MS Gothic', sans-serif">游ゴシック</option>
                    <option value="'Hiragino Mincho ProN', 'Meiryo', serif">ヒラギノ明朝</option>
                    <option value="'Courier New', Courier, monospace">等幅 (Courier)</option>
                </select>
            </div>

            <!-- 線の色 -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">線の色</label>
                <input type="color" id="lineColor" value="#ffb3b3" class="w-10 h-9 border rounded-lg cursor-pointer bg-white p-1">
            </div>

            <!-- サイズ設定 (行数・文字数) -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">縦の行数</label>
                <input type="number" id="rowCount" value="20" min="5" max="50" class="border rounded-lg px-2 py-1.5 w-16 text-center bg-slate-50">
            </div>

            <div>
                <label class="block text-xs text-slate-500 mb-1">1行の文字数</label>
                <input type="number" id="colCount" value="20" min="5" max="50" class="border rounded-lg px-2 py-1.5 w-16 text-center bg-slate-50">
            </div>

            <!-- ボタン群 -->
            <div class="flex items-end gap-2 mt-4 sm:mt-0">
                <button id="updateGrid" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition font-medium shadow-sm">
                    適用 / 再生成
                </button>
                <button id="savePdf" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition font-medium shadow-sm flex items-center gap-1">
                    💾 PDF保存
                </button>
            </div>
        </div>
    </div>

    <!-- 原稿用紙表示エリア (PDF保存対象) -->
    <div class="bg-white p-10 rounded-2xl shadow-xl overflow-auto max-w-full flex justify-center border border-slate-200">
        <div id="pdfArea" class="p-4 bg-white">
            <div id="genkouContainer" class="shadow-sm"></div>
        </div>
    </div>

    <script>
        function generateGrid() {
            const rowCount = parseInt(document.getElementById('rowCount').value) || 20;
            const colCount = parseInt(document.getElementById('colCount').value) || 20;
            const writingMode = document.getElementById('writingMode').value;
            const fontFamily = document.getElementById('fontFamily').value;
            const lineColor = document.getElementById('lineColor').value;
            
            const container = document.getElementById('genkouContainer');
            container.innerHTML = '';
            container.style.setProperty('--line-color', lineColor);
            container.style.fontFamily = fontFamily;

            // コンテナ全体のスタイル
            container.style.display = 'flex';
            container.style.backgroundColor = 'white';
            container.style.border = '2px solid #333';
            container.style.boxSizing = 'border-box';

            if (writingMode === 'vertical-rl') {
                container.style.writingMode = 'vertical-rl';
                container.style.flexDirection = 'row';
            } else {
                container.style.writingMode = 'horizontal-tb';
                container.style.flexDirection = 'column';
            }

            const primaryCount = writingMode === 'vertical-rl' ? colCount : rowCount;
            const secondaryCount = writingMode === 'vertical-rl' ? rowCount : colCount;

            const gridCells = [];

            for (let i = 0; i < primaryCount; i++) {
                const lineDiv = document.createElement('div');
                lineDiv.style.display = 'flex';
                if (writingMode === 'vertical-rl') {
                    lineDiv.style.flexDirection = 'column';
                } else {
                    lineDiv.style.flexDirection = 'row';
                }

                const rowCells = [];
                for (let j = 0; j < secondaryCount; j++) {
                    const cell = document.createElement('input');
                    cell.type = 'text';
                    cell.maxLength = 1;
                    cell.className = 'genkou-cell';
                    
                    // 入力時の自動フォーカス移動
                    cell.addEventListener('input', (e) => {
                        if (e.target.value.length === 1) {
                            focusNextCell(i, j, primaryCount, secondaryCount, writingMode, gridCells);
                        }
                    });

                    // 矢印キーやバックスペースでの移動
                    cell.addEventListener('keydown', (e) => {
                        handleKeyNavigation(e, i, j, primaryCount, secondaryCount, writingMode, gridCells);
                    });

                    lineDiv.appendChild(cell);
                    rowCells.push(cell);
                }
                container.appendChild(lineDiv);
                gridCells.push(rowCells);
            }
        }

        // 入力完了時に次のマスへ移動
        function focusNextCell(r, c, maxR, maxC, mode, grid) {
            if (mode === 'vertical-rl') {
                // 縦書き：上から下へ、端まで行ったら左の列へ
                if (c + 1 < maxC) {
                    grid[r][c + 1].focus();
                } else if (r + 1 < maxR) {
                    grid[r + 1][0].focus();
                }
            } else {
                // 横書き：左から右へ、端まで行ったら次の行へ
                if (c + 1 < maxC) {
                    grid[r][c + 1].focus();
                } else if (r + 1 < maxR) {
                    grid[r + 1][0].focus();
                }
            }
        }

        // キーボード操作のサポート
        function handleKeyNavigation(e, r, c, maxR, maxC, mode, grid) {
            let targetR = r;
            let targetC = c;

            if (e.key === 'ArrowRight') {
                if (mode === 'vertical-rl') targetR = Math.max(0, r - 1); // 縦書きの右は前の列
                else targetC = Math.min(maxC - 1, c + 1);
            } else if (e.key === 'ArrowLeft') {
                if (mode === 'vertical-rl') targetR = Math.min(maxR - 1, r + 1); // 縦書きの左は次の列
                else targetC = Math.max(0, c - 1);
            } else if (e.key === 'ArrowDown') {
                if (mode === 'vertical-rl') targetC = Math.min(maxC - 1, c + 1); // 縦書きの下は下のマス
                else targetR = Math.min(maxR - 1, r + 1);
            } else if (e.key === 'ArrowUp') {
                if (mode === 'vertical-rl') targetC = Math.max(0, c - 1); // 縦書きの上は上のマス
                else targetR = Math.max(0, r - 1);
            } else if (e.key === 'Backspace' && e.target.value === '') {
                // バックスペースで空のとき、前のマスに戻る
                if (mode === 'vertical-rl') {
                    if (c > 0) targetC = c - 1;
                    else if (r > 0) { targetR = r - 1; targetC = maxC - 1; }
                } else {
                    if (c > 0) targetC = c - 1;
                    else if (r > 0) { targetR = r - 1; targetC = maxC - 1; }
                }
            }

            if (targetR !== r || targetC !== c) {
                e.preventDefault();
                grid[targetR][targetC].focus();
            }
        }

        // PDF保存機能
        document.getElementById('savePdf').addEventListener('click', () => {
            const element = document.getElementById('pdfArea');
            const opt = {
                margin:       10,
                filename:     'genkou_youshi.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        });

        // イベントリスナーの設定
        document.getElementById('updateGrid').addEventListener('click', generateGrid);

        // 初期生成
        window.onload = generateGrid;
    </script>
</body>
</html>
