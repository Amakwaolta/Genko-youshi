<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原稿用紙エディタ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .genkou-cell {
            width: 36px;
            height: 36px;
            min-width: 36px;
            min-height: 36px;
            max-width: 36px;
            max-height: 36px;
            border: 1px solid var(--line-color, #ffb3b3);
            margin: 0;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            background: transparent;
            font-size: 1.1rem;
            line-height: 1;
            -webkit-user-select: text;
            user-select: text;
            flex-shrink: 0;
        }
        .genkou-cell:focus {
            background-color: rgba(239, 246, 255, 0.9);
            border-color: #2563eb;
            z-index: 10;
        }

        /* 印刷・PDF保存時のスタイル設定（Safari完全対応） */
        @media print {
            body * {
                visibility: hidden;
            }
            #pdfArea, #pdfArea * {
                visibility: visible;
            }
            #pdfArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                padding: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .genkou-page-wrapper {
                page-break-after: always;
                break-after: page;
                page-break-inside: avoid;
                break-inside: avoid;
                margin: 0 auto;
                padding: 20px;
                background: white !important;
                box-shadow: none !important;
                border: none !important;
            }
            .genkou-cell {
                background-color: transparent !important;
                border-color: var(--line-color, #ffb3b3) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- コントロールパネル -->
    <div class="no-print bg-white p-5 rounded-2xl shadow-md w-full max-w-6xl mb-4 flex flex-wrap gap-4 items-center justify-between">
        <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            📝 原稿用紙エディタ
        </h1>
        
        <div class="flex flex-wrap gap-3 items-center text-sm">
            <!-- 方向 -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">方向</label>
                <select id="writingMode" class="border rounded-lg px-2 py-1.5 bg-slate-50">
                    <option value="vertical-rl">縦書き</option>
                    <option value="horizontal-tb">横書き</option>
                </select>
            </div>

            <!-- フォント -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">フォント</label>
                <select id="fontFamily" class="border rounded-lg px-2 py-1.5 bg-slate-50">
                    <option value="'Yu Mincho', YuMincho, serif">游明朝</option>
                    <option value="'Yu Gothic', YuGothic, sans-serif">游ゴシック</option>
                    <option value="'MS Mincho', 'ＭＳ 明朝', serif">ＭＳ 明朝</option>
                    <option value="'MS Gothic', 'ＭＳ ゴシック', monospace">ＭＳ ゴシック</option>
                    <option value="'Hiragino Mincho ProN', 'ヒラギノ明朝 ProN', serif">ヒラギノ明朝</option>
                    <option value="'Hiragino Sans', 'ヒラギノ角ゴ ProN', sans-serif">ヒラギノ角ゴ</option>
                    <option value="'BIZ UDPMincho', serif">BIZ UDP明朝</option>
                    <option value="'BIZ UDPGothic', sans-serif">BIZ UDPゴシック</option>
                    <option value="'Courier New', Courier, monospace">等幅 (Courier)</option>
                </select>
            </div>

            <!-- 線の色 -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">線の色</label>
                <input type="color" id="lineColor" value="#ffb3b3" class="w-10 h-9 border rounded-lg cursor-pointer bg-white p-1">
            </div>

            <!-- サイズ設定 (行数・文字数) -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">縦の行数</label>
                <input type="number" id="rowCount" value="20" min="5" max="50" class="border rounded-lg px-2 py-1.5 w-16 text-center bg-slate-50">
            </div>

            <div>
                <label class="block text-xs text-slate-500 mb-1">1行の文字数</label>
                <input type="number" id="colCount" value="20" min="5" max="50" class="border rounded-lg px-2 py-1.5 w-16 text-center bg-slate-50">
            </div>

            <!-- ページ数 -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">ページ数</label>
                <input type="number" id="pageCount" value="1" min="1" max="50" class="border rounded-lg px-2 py-1.5 w-16 text-center bg-slate-50">
            </div>

            <!-- ボタン群 -->
            <div class="flex items-end gap-2 mt-4 sm:mt-0">
                <button id="updateGrid" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition font-medium shadow-sm">
                    適用 / 再生成
                </button>
                <button id="savePdf" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition font-medium shadow-sm flex items-center gap-1">
                    💾 PDF保存
                </button>
            </div>
        </div>
    </div>

    <!-- コピペ・一括入出力パネル -->
    <div class="no-print bg-white p-4 rounded-2xl shadow-md w-full max-w-6xl mb-4 flex flex-col gap-2">
        <div class="flex justify-between items-center">
            <span class="text-sm font-bold text-slate-700">📋 テキスト一括入出力（改行対応・複数ページ自動拡張）</span>
            <div class="flex gap-2">
                <button id="importTextBtn" class="bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-blue-600 transition">
                    テキストを原稿用紙に反映
                </button>
                <button id="exportTextBtn" class="bg-slate-600 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-slate-700 transition">
                    原稿用紙からテキストを取得
                </button>
            </div>
        </div>
        <textarea id="bulkText" rows="3" placeholder="ここに文章を貼り付けて「テキストを原稿用紙に反映」を押すと、改行や長さに応じて自動で複数ページに綺麗に流し込まれます。" class="border rounded-lg p-2 text-sm bg-slate-50 w-full focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>

    <!-- 原稿用紙表示エリア -->
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-6xl h-[65vh] overflow-auto flex flex-col items-center border border-slate-200 gap-8">
        <div id="pdfArea" class="bg-white flex flex-col items-center w-full p-4">
            <div id="pagesContainer" class="flex flex-col items-center gap-8 w-full"></div>
        </div>
    </div>

    <script>
        let allPagesCells = []; 
        let primaryMax = 0;
        let secondaryMax = 0;

        function generateGrid() {
            const rowCount = parseInt(document.getElementById('rowCount').value) || 20;
            const colCount = parseInt(document.getElementById('colCount').value) || 20;
            const pageCount = parseInt(document.getElementById('pageCount').value) || 1;
            const writingMode = document.getElementById('writingMode').value;
            const fontFamily = document.getElementById('fontFamily').value;
            const lineColor = document.getElementById('lineColor').value;
            
            const container = document.getElementById('pagesContainer');
            container.innerHTML = '';
            container.style.fontFamily = fontFamily;

            primaryMax = writingMode === 'vertical-rl' ? colCount : rowCount;
            secondaryMax = writingMode === 'vertical-rl' ? rowCount : colCount;

            allPagesCells = [];

            for (let p = 0; p < pageCount; p++) {
                const pageWrapper = document.createElement('div');
                pageWrapper.className = 'genkou-page-wrapper flex flex-col items-center shadow-sm relative rounded-xl border border-slate-200';
                pageWrapper.style.width = 'fit-content';

                const pageNumLabel = document.createElement('div');
                pageNumLabel.className = 'no-print text-xs text-slate-400 mb-2 font-medium';
                pageNumLabel.textContent = `- ${p + 1} -`;
                pageWrapper.appendChild(pageNumLabel);

                const gridContainer = document.createElement('div');
                gridContainer.style.setProperty('--line-color', lineColor);
                gridContainer.style.display = 'flex';
                gridContainer.style.backgroundColor = 'white';
                gridContainer.style.border = '2px solid #333';
                gridContainer.style.boxSizing = 'content-box';
                gridContainer.style.padding = '4px';

                if (writingMode === 'vertical-rl') {
                    gridContainer.style.writingMode = 'vertical-rl';
                    gridContainer.style.flexDirection = 'row';
                } else {
                    gridContainer.style.writingMode = 'horizontal-tb';
                    gridContainer.style.flexDirection = 'column';
                }

                const pageCells = [];
                for (let i = 0; i < primaryMax; i++) {
                    const lineDiv = document.createElement('div');
                    lineDiv.style.display = 'flex';
                    lineDiv.style.flexShrink = '0';
                    if (writingMode === 'vertical-rl') {
                        lineDiv.style.flexDirection = 'column';
                    } else {
                        lineDiv.style.flexDirection = 'row';
                    }

                    const rowCells = [];
                    for (let j = 0; j < secondaryMax; j++) {
                        const cell = document.createElement('div');
                        cell.contentEditable = true;
                        cell.className = 'genkou-cell';
                        
                        cell.addEventListener('input', (e) => {
                            let text = cell.textContent;
                            if (text.length > 1) {
                                cell.textContent = text.slice(-1);
                                const range = document.createRange();
                                const sel = window.getSelection();
                                range.selectNodeContents(cell);
                                range.collapse(false);
                                sel.removeAllRanges();
                                sel.addRange(range);
                            }
                            if (cell.textContent.length === 1) {
                                focusNextCell(p, i, j, primaryMax, secondaryMax);
                            }
                        });

                        cell.addEventListener('keydown', (e) => {
                            handleKeyNavigation(e, p, i, j, primaryMax, secondaryMax, writingMode, cell);
                        });

                        lineDiv.appendChild(cell);
                        rowCells.push(cell);
                    }
                    gridContainer.appendChild(lineDiv);
                    pageCells.push(rowCells);
                }

                pageWrapper.appendChild(gridContainer);
                container.appendChild(pageWrapper);
                allPagesCells.push(pageCells);
            }
        }

        function focusNextCell(p, r, c, maxR, maxC) {
            if (c + 1 < maxC) {
                allPagesCells[p][r][c + 1].focus();
            } else if (r + 1 < maxR) {
                allPagesCells[p][r + 1][0].focus();
            } else if (p + 1 < allPagesCells.length) {
                allPagesCells[p + 1][0][0].focus();
            }
        }

        function handleKeyNavigation(e, p, r, c, maxR, maxC, mode, cell) {
            let targetP = p;
            let targetR = r;
            let targetC = c;

            if (e.key === 'ArrowRight') {
                if (mode === 'vertical-rl') {
                    targetR = Math.max(0, r - 1);
                } else {
                    if (c + 1 < maxC) targetC = c + 1;
                    else if (p + 1 < allPagesCells.length) { targetP++; targetR = r; targetC = 0; }
                }
            } else if (e.key === 'ArrowLeft') {
                if (mode === 'vertical-rl') {
                    targetR = Math.min(maxR - 1, r + 1);
                } else {
                    if (c > 0) targetC = c - 1;
                    else if (p > 0) { targetP--; targetR = r; targetC = maxC - 1; }
                }
            } else if (e.key === 'ArrowDown') {
                if (mode === 'vertical-rl') {
                    if (c + 1 < maxC) targetC = c + 1;
                    else if (p + 1 < allPagesCells.length) { targetP++; targetR = 0; targetC = 0; }
                } else {
                    targetR = Math.min(maxR - 1, r + 1);
                }
            } else if (e.key === 'ArrowUp') {
                if (mode === 'vertical-rl') {
                    if (c > 0) targetC = c - 1;
                    else if (p > 0) { targetP--; targetR = maxR - 1; targetC = maxC - 1; }
                } else {
                    targetR = Math.max(0, r - 1);
                }
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (r + 1 < maxR) {
                    targetR = r + 1;
                    targetC = 0;
                } else if (p + 1 < allPagesCells.length) {
                    targetP++;
                    targetR = 0;
                    targetC = 0;
                }
            } else if (e.key === 'Backspace' && cell.textContent === '') {
                e.preventDefault();
                if (c > 0) targetC = c - 1;
                else if (r > 0) { targetR = r - 1; targetC = maxC - 1; }
                else if (p > 0) { targetP--; targetR = maxR - 1; targetC = maxC - 1; }
                
                const targetCell = allPagesCells[targetP][targetR][targetC];
                targetCell.textContent = '';
                targetCell.focus();
                return;
            }

            if (targetP !== p || targetR !== r || targetC !== c) {
                e.preventDefault();
                allPagesCells[targetP][targetR][targetC].focus();
            }
        }

        // テキスト一括流し込み（改行反映・自動ページ拡張）
        document.getElementById('importTextBtn').addEventListener('click', () => {
            const text = document.getElementById('bulkText').value;
            
            let simP = 0, simR = 0, simC = 0;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '\n' || char === '\r') {
                    simR++;
                    simC = 0;
                    if (simR >= primaryMax) {
                        simP++;
                        simR = 0;
                        simC = 0;
                    }
                    if (char === '\r' && text[i+1] === '\n') i++;
                    continue;
                }
                simC++;
                if (simC >= secondaryMax) {
                    simC = 0;
                    simR++;
                }
                if (simR >= primaryMax) {
                    simP++;
                    simR = 0;
                    simC = 0;
                }
            }
            const neededPages = Math.max(1, simP + 1);
            
            document.getElementById('pageCount').value = neededPages;
            generateGrid();

            let p = 0, r = 0, c = 0;
            for (let page of allPagesCells) {
                for (let row of page) {
                    for (let cell of row) {
                        cell.textContent = '';
                    }
                }
            }

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '\n' / char === '\r') {
                    r++;
                    c = 0;
                    if (r >= primaryMax) {
                        p++;
                        r = 0;
                        c = 0;
                    }
                    if (p >= allPagesCells.length) break;
                    if (char === '\r' && text[i+1] === '\n') i++;
                    continue;
                }
                if (char === '\n') {
                    r++;
                    c = 0;
                    if (r >= primaryMax) {
                        p++;
                        r = 0;
                        c = 0;
                    }
                    if (p >= allPagesCells.length) break;
                    continue;
                }

                if (p >= allPagesCells.length) break;
                allPagesCells[p][r][c].textContent = char;

                c++;
                if (c >= secondaryMax) {
                    c = 0;
                    r++;
                }
                if (r >= primaryMax) {
                    r = 0;
                    p++;
                }
            }
        });

        // 原稿用紙からテキストを取得
        document.getElementById('exportTextBtn').addEventListener('click', () => {
            let fullText = '';
            for (let p = 0; p < allPagesCells.length; p++) {
                let pageCells = allPagesCells[p];
                for (let i = 0; i < pageCells.length; i++) {
                    let lineText = '';
                    for (let j = 0; j < pageCells[i].length; j++) {
                        const val = pageCells[i][j].textContent;
                        lineText += val ? val : '　';
                    }
                    fullText += lineText.trimEnd() + '\n';
                }
            }
            document.getElementById('bulkText').value = fullText.trim();
        });

        // PDF保存機能（Safariのネイティブ印刷・PDF保存機能を呼び出し）
        document.getElementById('savePdf').addEventListener('click', () => {
            window.print();
        });

        document.getElementById('updateGrid').addEventListener('click', generateGrid);

        window.onload = generateGrid;
    </script>
</body>
</html>
