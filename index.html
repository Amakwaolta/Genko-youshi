<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原稿用紙エディタ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .genkou-cell {
            width: 34px;
            height: 34px;
            border: 1px solid var(--line-color, #ffb3b3);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            background: transparent;
            font-size: 1.1rem;
            caret-color: #2563eb;
        }
        .genkou-cell:focus {
            background-color: rgba(239, 246, 255, 0.8);
            border-color: #2563eb;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- コントロールパネル -->
    <div class="bg-white p-5 rounded-2xl shadow-md w-full max-w-6xl mb-4 flex flex-wrap gap-4 items-center justify-between">
        <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            📝 原稿用紙エディタ
        </h1>
        
        <div class="flex flex-wrap gap-3 items-center text-sm">
            <!-- 方向 -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">方向</label>
                <select id="writingMode" class="border rounded-lg px-2 py-1.5 bg-slate-50">
                    <option value="vertical-rl">縦書き</option>
                    <option value="horizontal-tb">横書き</option>
                </select>
            </div>

            <!-- フォント -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">フォント</label>
                <select id="fontFamily" class="border rounded-lg px-2 py-1.5 bg-slate-50">
                    <option value="'Yu Mincho', YuMincho, 'MS Mincho', serif">游明朝</option>
                    <option value="'Yu Gothic', YuGothic, 'MS Gothic', sans-serif">游ゴシック</option>
                    <option value="'Hiragino Mincho ProN', 'Meiryo', serif">ヒラギノ明朝</option>
                    <option value="'Courier New', Courier, monospace">等幅 (Courier)</option>
                </select>
            </div>

            <!-- 線の色 -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">線の色</label>
                <input type="color" id="lineColor" value="#ffb3b3" class="w-10 h-9 border rounded-lg cursor-pointer bg-white p-1">
            </div>

            <!-- サイズ設定 (行数・文字数) -->
            <div>
                <label class="block text-xs text-slate-500 mb-1">縦の行数</label>
                <input type="number" id="rowCount" value="20" min="5" max="50" class="border rounded-lg px-2 py-1.5 w-16 text-center bg-slate-50">
            </div>

            <div>
                <label class="block text-xs text-slate-500 mb-1">1行の文字数</label>
                <input type="number" id="colCount" value="20" min="5" max="50" class="border rounded-lg px-2 py-1.5 w-16 text-center bg-slate-50">
            </div>

            <!-- ボタン群 -->
            <div class="flex items-end gap-2 mt-4 sm:mt-0">
                <button id="updateGrid" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition font-medium shadow-sm">
                    適用 / 再生成
                </button>
                <button id="savePdf" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition font-medium shadow-sm flex items-center gap-1">
                    💾 PDF保存
                </button>
            </div>
        </div>
    </div>

    <!-- コピペ・一括入出力パネル -->
    <div class="bg-white p-4 rounded-2xl shadow-md w-full max-w-6xl mb-4 flex flex-col gap-2">
        <div class="flex justify-between items-center">
            <span class="text-sm font-bold text-slate-700">📋 テキスト一括入出力（コピペ用）</span>
            <div class="flex gap-2">
                <button id="importTextBtn" class="bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-blue-600 transition">
                    テキストを原稿用紙に反映
                </button>
                <button id="exportTextBtn" class="bg-slate-600 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-slate-700 transition">
                    原稿用紙からテキストを取得
                </button>
            </div>
        </div>
        <textarea id="bulkText" rows="3" placeholder="ここに文章を貼り付けて「テキストを原稿用紙に反映」を押すと、原稿用紙のマスに自動で流し込まれます。" class="border rounded-lg p-2 text-sm bg-slate-50 w-full focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>

    <!-- 原稿用紙表示エリア (PDF保存対象) - 枠を広くしてスクロール対応 -->
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-6xl h-[65vh] overflow-auto flex justify-center border border-slate-200">
        <div id="pdfArea" class="p-4 bg-white inline-block">
            <div id="genkouContainer" class="shadow-sm"></div>
        </div>
    </div>

    <script>
        let gridCells = [];
        let primaryMax = 0;
        let secondaryMax = 0;

        function generateGrid() {
            const rowCount = parseInt(document.getElementById('rowCount').value) || 20;
            const colCount = parseInt(document.getElementById('colCount').value) || 20;
            const writingMode = document.getElementById('writingMode').value;
            const fontFamily = document.getElementById('fontFamily').value;
            const lineColor = document.getElementById('lineColor').value;
            
            const container = document.getElementById('genkouContainer');
            container.innerHTML = '';
            container.style.setProperty('--line-color', lineColor);
            container.style.fontFamily = fontFamily;

            container.style.display = 'flex';
            container.style.backgroundColor = 'white';
            container.style.border = '2px solid #333';
            container.style.boxSizing = 'border-box';

            if (writingMode === 'vertical-rl') {
                container.style.writingMode = 'vertical-rl';
                container.style.flexDirection = 'row';
            } else {
                container.style.writingMode = 'horizontal-tb';
                container.style.flexDirection = 'column';
            }

            primaryMax = writingMode === 'vertical-rl' ? colCount : rowCount;
            secondaryMax = writingMode === 'vertical-rl' ? rowCount : colCount;

            gridCells = [];

            for (let i = 0; i < primaryMax; i++) {
                const lineDiv = document.createElement('div');
                lineDiv.style.display = 'flex';
                if (writingMode === 'vertical-rl') {
                    lineDiv.style.flexDirection = 'column';
                } else {
                    lineDiv.style.flexDirection = 'row';
                }

                const rowCells = [];
                for (let j = 0; j < secondaryMax; j++) {
                    const cell = document.createElement('input');
                    cell.type = 'text';
                    cell.maxLength = 1;
                    cell.className = 'genkou-cell';
                    
                    cell.addEventListener('input', (e) => {
                        if (e.target.value.length === 1) {
                            focusNextCell(i, j, primaryMax, secondaryMax, writingMode, gridCells);
                        }
                    });

                    cell.addEventListener('keydown', (e) => {
                        handleKeyNavigation(e, i, j, primaryMax, secondaryMax, writingMode, gridCells);
                    });

                    lineDiv.appendChild(cell);
                    rowCells.push(cell);
                }
                container.appendChild(lineDiv);
                gridCells.push(rowCells);
            }
        }

        function focusNextCell(r, c, maxR, maxC, mode, grid) {
            if (c + 1 < maxC) {
                grid[r][c + 1].focus();
            } else if (r + 1 < maxR) {
                grid[r + 1][0].focus();
            }
        }

        function handleKeyNavigation(e, r, c, maxR, maxC, mode, grid) {
            let targetR = r;
            let targetC = c;

            if (e.key === 'ArrowRight') {
                if (mode === 'vertical-rl') targetR = Math.max(0, r - 1);
                else targetC = Math.min(maxC - 1, c + 1);
            } else if (e.key === 'ArrowLeft') {
                if (mode === 'vertical-rl') targetR = Math.min(maxR - 1, r + 1);
                else targetC = Math.max(0, c - 1);
            } else if (e.key === 'ArrowDown') {
                if (mode === 'vertical-rl') targetC = Math.min(maxC - 1, c + 1);
                else targetR = Math.min(maxR - 1, r + 1);
            } else if (e.key === 'ArrowUp') {
                if (mode === 'vertical-rl') targetC = Math.max(0, c - 1);
                else targetR = Math.max(0, r - 1);
            } else if (e.key === 'Backspace' && e.target.value === '') {
                if (c > 0) targetC = c - 1;
                else if (r > 0) { targetR = r - 1; targetC = maxC - 1; }
            }

            if (targetR !== r || targetC !== c) {
                e.preventDefault();
                grid[targetR][targetC].focus();
            }
        }

        // テキストを原稿用紙に一括流し込み
        document.getElementById('importTextBtn').addEventListener('click', () => {
            const text = document.getElementById('bulkText').value;
            // セルをクリア
            for (let i = 0; i < gridCells.length; i++) {
                for (let j = 0; j < gridCells[i].length; j++) {
                    gridCells[i][j].value = '';
                }
            }

            let charIndex = 0;
            for (let i = 0; i < gridCells.length && charIndex < text.length; i++) {
                for (let j = 0; j < gridCells[i].length && charIndex < text.length; j++) {
                    let char = text[charIndex];
                    if (char === '\n' || char === '\r') {
                        charIndex++;
                        j--; // 改行はスキップして次へ
                        continue;
                    }
                    gridCells[i][j].value = char;
                    charIndex++;
                }
            }
        });

        // 原稿用紙からテキストを取得してテキストエリアに表示
        document.getElementById('exportTextBtn').addEventListener('click', () => {
            let text = '';
            for (let i = 0; i < gridCells.length; i++) {
                let lineText = '';
                for (let j = 0; j < gridCells[i].length; j++) {
                    const val = gridCells[i][j].value;
                    lineText += val ? val : '　';
                }
                text += lineText.trimEnd() + '\n';
            }
            document.getElementById('bulkText').value = text.trim();
        });

        // PDF保存機能
        document.getElementById('savePdf').addEventListener('click', () => {
            const element = document.getElementById('pdfArea');
            const opt = {
                margin:       10,
                filename:     'genkou_youshi.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        });

        document.getElementById('updateGrid').addEventListener('click', generateGrid);

        window.onload = generateGrid;
    </script>
</body>
</html>
